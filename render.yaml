services:
  - type: web
    name: odds-filter-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
